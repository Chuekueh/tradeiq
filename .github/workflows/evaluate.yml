name: RAG Evaluation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/evaluation/**"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      RAG_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check API key
        id: check_key
        run: |
          if [ -z "$RAG_OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY secret not set. Skipping evaluation."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_key.outputs.has_key == 'true'
      - uses: actions/setup-python@v5
        if: steps.check_key.outputs.has_key == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.check_key.outputs.has_key == 'true'
        run: pip install -e ".[dev]"
      - name: Run evaluation
        if: steps.check_key.outputs.has_key == 'true'
        run: python scripts/run_evaluation.py --output-md evaluation-report.md --output-json evaluation-results.json
      - name: Upload evaluation report
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            evaluation-report.md
            evaluation-results.json
